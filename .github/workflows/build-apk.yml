name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Shivam & Riya Mart APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK and Licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          fi
          sudo mkdir -p "$SDK_DIR/licenses" "$SDK_DIR/platforms" "$SDK_DIR/build-tools"
          sudo chmod -R 777 "$SDK_DIR" || true
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Prepare Signing Keystore and Env Defaults
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "debug.keystore.base64" ]; then
            tr -d '\n\r ' < debug.keystore.base64 | base64 --decode > debug.keystore
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Install Gradle 9.3.1 and Build APK
        shell: bash
        run: |
          set -eo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp
          if ! /tmp/gradle-9.3.1/bin/gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log; then
            echo "### ❌ Gradle Build Error Details" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 /tmp/gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk Shivam-Riya-Mart.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shivam-Riya-Mart-APK
          path: Shivam-Riya-Mart.apk
          if-no-files-found: error

      - name: Publish Direct Download APK Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null
          if gh release create latest-apk Shivam-Riya-Mart.apk \
            --title "Shri Shivam & Riya Mart — Android App (APK)" \
            --notes "Tap Shivam-Riya-Mart.apk below under Assets to download and install directly on Android."; then
            DL_URL="https://github.com/${{ github.repository }}/releases/download/latest-apk/Shivam-Riya-Mart.apk"
            {
              echo "## ✅ APK Ready! (आपका ऐप तैयार है)"
              echo ""
              echo "### 📲 1-Click Direct APK Download Link:"
              echo "**[$DL_URL]($DL_URL)**"
              echo ""
              echo "1. **अपने फ़ोन के लिए:** ऊपर दिए नीले लिंक पर टैप करें → डाउनलोड करके Install करें।"
              echo "2. **ग्राहकों के लिए:** ऊपर दिए लिंक को Copy करके अपने ऐप के Owner Dashboard में Save करें और WhatsApp पर शेयर करें!"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ✅ APK Built in Artifacts!"
              echo "Scroll down to **Artifacts** below and tap **Shivam-Riya-Mart-APK** to download."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
