name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Shivam & Riya Mart APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK (API 36.1 & Build Tools 36.0.0)
        shell: bash
        run: |
          set -euo pipefail
          {
            SDK_DIR="$HOME/android-sdk"
            rm -rf "$SDK_DIR"
            mkdir -p "$SDK_DIR/cmdline-tools" "$SDK_DIR/licenses"

            printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_DIR/licenses/android-sdk-license"
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_DIR/licenses/android-sdk-preview-license"

            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/bootstrap"

            set +o pipefail
            yes | "$SDK_DIR/cmdline-tools/bootstrap/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            set -o pipefail

            "$SDK_DIR/cmdline-tools/bootstrap/bin/sdkmanager" --sdk_root="$SDK_DIR" --install "cmdline-tools;latest"

            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER="$SDK_DIR/cmdline-tools/bootstrap/bin/sdkmanager"
            fi

            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            set -o pipefail

            "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36"
            "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platforms;android-36.1" || true

            if [ ! -d "$SDK_DIR/platforms/android-36.1" ] && [ -d "$SDK_DIR/platforms/android-36" ]; then
              cp -R "$SDK_DIR/platforms/android-36" "$SDK_DIR/platforms/android-36.1"
              sed -i 's/^AndroidVersion.ApiLevel=.*/AndroidVersion.ApiLevel=36.1/' "$SDK_DIR/platforms/android-36.1/source.properties"
              if ! grep -q "^AndroidVersion.ApiLevel=" "$SDK_DIR/platforms/android-36.1/source.properties"; then
                echo "AndroidVersion.ApiLevel=36.1" >> "$SDK_DIR/platforms/android-36.1/source.properties"
              fi
              if [ -f "$SDK_DIR/platforms/android-36.1/package.xml" ]; then
                sed -i 's/platforms;android-36"/platforms;android-36.1"/g' "$SDK_DIR/platforms/android-36.1/package.xml"
                sed -i 's/<api-level>36<\/api-level>/<api-level>36.1<\/api-level>/g' "$SDK_DIR/platforms/android-36.1/package.xml"
              fi
            fi

            echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          } 2>&1 | tee /tmp/sdk-setup.log

      - name: Prepare Signing Keystore, Firebase Config and Env
        shell: bash
        env:
          DEBUG_KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          {
            if [ -s "debug.keystore.base64" ]; then
              tr -d '\n\r\t ' < debug.keystore.base64 | base64 --decode > debug.keystore
            elif [ -n "${DEBUG_KEYSTORE_SECRET:-}" ]; then
              printf '%s' "$DEBUG_KEYSTORE_SECRET" | tr -d '\n\r\t ' | base64 --decode > debug.keystore
            fi
            if [ ! -s "debug.keystore" ]; then
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi

            if [ ! -s "app/google-services.json" ]; then
              if [ -n "${GOOGLE_SERVICES_SECRET:-}" ]; then
                if printf '%s' "$GOOGLE_SERVICES_SECRET" | grep -q '{'; then
                  printf '%s' "$GOOGLE_SERVICES_SECRET" > app/google-services.json
                else
                  printf '%s' "$GOOGLE_SERVICES_SECRET" | tr -d '\n\r\t ' | base64 --decode > app/google-services.json
                fi
              else
                {
                  echo "## ⚠️ Firebase Config Needed (`GOOGLE_SERVICES_JSON`)"
                  echo "AI Studio सुरक्षा के लिए `app/google-services.json` को GitHub पर सीधे अपलोड नहीं करता।"
                  echo "1. सबसे आसान तरीका: **AI Studio में ऊपर Settings (⚙️) -> Generate APK** दबाकर सीधा लाइव APK डाउनलोड करें!"
                  echo "2. या GitHub में `Settings -> Secrets and variables -> Actions -> New repository secret` खोलें, Name में `GOOGLE_SERVICES_JSON` लिखें और AI Studio के `app/google-services.json` का कंटेंट पेस्ट कर दें।"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi

            if [ ! -f ".env" ]; then
              if [ -f ".env.example" ]; then
                cp .env.example .env
              else
                touch .env
              fi
            fi
          } 2>&1 | tee /tmp/prepare-config.log

      - name: Install Gradle 9.3.1 and Build APK
        shell: bash
        run: |
          set -eo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp
          /tmp/gradle-9.3.1/bin/gradle :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace 2>&1 | tee /tmp/gradle-build.log
          cp app/build/outputs/apk/debug/app-debug.apk Shivam-Riya-Mart.apk

      - name: Upload Direct APK Artifact
        uses: actions/upload-artifact@v7
        with:
          path: Shivam-Riya-Mart.apk
          archive: false
          if-no-files-found: error

      - name: Publish 1-Click Download APK Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null
          if gh release create latest-apk Shivam-Riya-Mart.apk \
            --target "${{ github.sha }}" \
            --title "Shri Shivam & Riya Mart — Live Cloud Shopping APK" \
            --notes "Download Shivam-Riya-Mart.apk under Assets. Includes live Flipkart-style multi-phone cloud sync and 1-Tap Google Sign-In."; then
            DL_URL="https://github.com/${{ github.repository }}/releases/download/latest-apk/Shivam-Riya-Mart.apk"
            {
              echo "## ✅ Live Cloud APK Ready! (फ्लिपकार्ट जैसा लाइव सिंक ऐप तैयार है!)"
              echo ""
              echo "### 📲 1-Click Direct APK Download Link:"
              echo "**[$DL_URL]($DL_URL)**"
              echo ""
              echo "1. **लाइव क्लाउड सिंक:** आप अपने फोन से जो भी नया सामान या दाम डालेंगे, ग्राहक के फोन में 1 सेकंड में लाइव दिखेगा!"
              echo "2. **ग्राहकों के लिए:** ऊपर दिए लिंक को WhatsApp पर भेजें — ग्राहक 1-Tap Google से खोलकर तुरंत ऑर्डर कर सकते हैं।"
              echo "3. **मालिक पैनल:** केवल आपके सत्यापित Google अकाउंट (`rajuguptas123@gmail.com` / `eminence713@gmail.com`) में Owner पैनल खुलेगा।"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## ✅ APK Ready in Artifacts!"
              echo "नीचे **Artifacts** सेक्शन में **Shivam-Riya-Mart.apk** पर टैप करके सीधा APK डाउनलोड करें।"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Print Diagnostics on Failure
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ Build Diagnostic Log"
            for f in /tmp/sdk-setup.log /tmp/prepare-config.log /tmp/gradle-build.log; do
              if [ -f "$f" ]; then
                echo "### Tail of $(basename "$f")"
                echo '```'
                tail -n 60 "$f"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
